version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      cargo-non-major:
        update-types: ["minor", "patch"]

  - package-ecosystem: "bun"
    directory: "/web"
    schedule:
      interval: "weekly"
    groups:
      bun-non-major:
        update-types: ["minor", "patch"]
