# Elizabeth Backend Configuration (Docker)
#
# NOTE:
# - 该文件必须匹配 `crates/configrs::Config` 的 schema（顶层为 `app:`）。
# - 不要在这里写 "${JWT_SECRET}" 这类“伪插值”：YAML 不会自动从环境变量替换。
#   真实的密钥请通过环境变量 `JWT_SECRET` 注入（`crates/board/src/init/cfg_service.rs` 会覆盖）。

app:
  server:
    addr: "0.0.0.0"
    port: 4092

  logging:
    level: "info"

  database:
    # NOTE: For an absolute path, SQLx expects three slashes.
    # - ✅ absolute: sqlite:///app/data/elizabeth.db
    # - ❌ (treated as relative to CWD): sqlite:/app/data/elizabeth.db
    url: "sqlite:///app/data/elizabeth.db"
    # SQLite 并发写入能力有限，连接池不宜过大
    max_connections: 10
    min_connections: 1
    # macOS Docker(virtiofs/gRPC FUSE) 下 WAL 可能触发“Device or resource busy”，默认用 delete 更稳
    journal_mode: "delete"

  storage:
    # 内容存储位置；容器内固定指向 /app/storage bind mount。
    root: "/app/storage/rooms"
    # 以下四项与 docker-compose.yml 的 STORAGE_* 默认值保持一致。
    # fs = 本地文件系统；s3 = S3 兼容对象存储（需同时提供 s3.* 连接信息）。
    backend: fs
    # proxy = 所有上传下载经服务端代理；presigned = 签发短时效直传/直下 URL（仅 backend=s3）。
    transfer: proxy
    # 预签名 URL 有效期（秒）。
    presign_ttl_seconds: 300
    # 跨房间内容去重构成存在性 oracle，默认关闭。
    global_dedup: false

  jwt:
    # 生产环境必须通过 env 覆盖（长度 >= 32）
    secret: "please-change-this-secret-in-production-min-32-chars-long-for-security" # pragma: allowlist secret
    ttl_seconds: 7200
    leeway_seconds: 5
    refresh_ttl_seconds: 604800
    cleanup_interval_seconds: 86400
    enable_refresh_token_rotation: true

  room:
    # 所有新建房间统一使用这里的默认值：包括完整创建流程和直接 URL 自动创建。
    defaults:
      password: null
      max_times_entered: 100
      max_size: 50MiB
      # 新房间默认加入角色（admin / editor / reader）。权限位由角色推导，
      # 不存在 per-flag 的默认值开关。
      role: reader
    expiry:
      # 支持 humantime 格式，例如 m/min、h、d、w
      allowed_ages: [1m, 30m, 2h, 12h, 1d, 7d, 30d, 365d]
      default_age: 2h
    share_disabled_lock_duration: 1h

  upload:
    reservation_ttl_seconds: 3600

  gc:
    # 周期性 reconciliation：
    # - 清理显式过期房间
    # - 清理“满且无显式过期、且已空房”的房间
    # - 释放私密房间旧名称
    interval_seconds: 60
    # 单次最多处理的房间数量（防止一次扫太久）
    batch_limit: 200

  middleware:
    compression:
      enabled: true
      min_content_length: 1024
    cors:
      enabled: true
      allowed_origins:
        - "*"
      allowed_methods:
        - "GET"
        - "POST"
        - "PUT"
        - "DELETE"
        - "OPTIONS"
      allowed_headers:
        - "*"
      allow_credentials: false
      max_age: 3600
      expose_headers: []
    security:
      enabled: true
      # 私人分享工具默认不应被搜索引擎收录。
      disallow_search_indexing: true
    rate_limit:
      # 与 docker-compose.yml 的 MIDDLEWARE_RATE_LIMIT_* 默认值保持一致。
      # 按客户端 IP 计数的令牌桶；需要高于前端实际上传请求速率。
      enabled: true
      per_second: 20
      burst_size: 40
      cleanup_interval_seconds: 60
